<aside class="aside">
    <h2 class="logo">Red Social</h2>

    <nav>
        <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
        <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>
    </nav>

    @if (usuario) {
        <div class="usuario">
        <img class="avatar" [src]="usuario.imagenPerfil || 'avatar-default.png'" alt="Foto de perfil" />
        <span class="usuario-nombre">{{ usuario.nombre }} {{ usuario.apellido }}</span>
        </div>
    }

    <button type="button" class="btn-tema" (click)="tema.alternar()">
        {{ tema.tema() === 'claro' ? '🌙' : '☀️' }}
    </button>

    <button type="button" class="btn-salir" (click)="cerrarSesion()">Cerrar sesión</button>
</aside>
