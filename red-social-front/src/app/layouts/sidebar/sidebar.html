<aside class="aside">
    <h2 class="logo">
        <a routerLink="/publicaciones" routerLinkActive="activo">Panda</a>
    </h2>

    <nav>
        <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
        <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>
    </nav>

    @if (usuario) {
    <div class="usuario">
        @if (usuario.imagenPerfil) {
        <img class="avatar" [src]="usuario.imagenPerfil" alt="Foto de perfil" />
        } @else {
        <div class="avatar iniciales">{{ usuario.nombre | iniciales: usuario.apellido }}</div>
        }
        <span class="usuario-nombre">{{ usuario.nombre }} {{ usuario.apellido }}</span>
    </div>
    }

    @if (esAdmin) {
        <div class="opciones-admin">
            <a routerLink="/dashboard/usuarios" routerLinkActive="activo">Ver usuarios</a>
            <a routerLink="/dashboard/estadisticas" routerLinkActive="activo">Estadísticas</a>
        </div>
    }

    <button type="button" class="btn-tema" (click)="tema.alternar()">
        {{ tema.tema() === 'claro' ? '🌙' : '☀️' }}
    </button>

    <button type="button" class="btn-salir" (click)="cerrarSesion()">Cerrar sesión</button>
</aside>
